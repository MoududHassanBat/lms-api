databaseChangeLog:
  # Spring Modulith event publication registry (our transactional outbox).
  # Matches the JPA entity in spring-modulith-events-jpa; checked by ddl-auto: validate.
  - changeSet:
      id: 001-create-event-publication
      author: lms
      changes:
        - createTable:
            schemaName: common
            tableName: event_publication
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: listener_id
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: serialized_event
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: publication_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completion_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: last_resubmission_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: completion_attempts
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
        - createIndex:
            schemaName: common
            tableName: event_publication
            indexName: event_publication_completion_date_idx
            columns:
              - column:
                  name: completion_date

  # A simple table to see Liquibase working: key/value system info.
  - changeSet:
      id: 002-create-system-info
      author: lms
      changes:
        - createTable:
            schemaName: common
            tableName: system_info
            columns:
              - column:
                  name: info_key
                  type: VARCHAR(100)
                  constraints:
                    primaryKey: true
              - column:
                  name: info_value
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
        - insert:
            schemaName: common
            tableName: system_info
            columns:
              - column:
                  name: info_key
                  value: app.label
              - column:
                  name: info_value
                  value: Training Artifact — Not for Production Use
